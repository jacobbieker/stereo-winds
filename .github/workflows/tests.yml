name: tests

# The GPU, network and live-data tests are deselected by marker: a hosted
# runner has no GPU and no credentials for the source.coop stores, so they
# would fail for reasons that say nothing about the change under review.
# Run them locally with `pixi run python -m pytest tests/`.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  # A new push supersedes the run in flight for the same ref.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Everything not marked as needing a GPU, the network, or live data.
  PYTEST_SELECTION: not integration_live and not network

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One suite failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - name: stereo_winds
            environment: default
            path: tests/
          - name: operational
            environment: operational
            path: operational/tests/

    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        # The solved environment is ~7 GB, mostly the CUDA build of torch
        # that the lock pins; a stock runner does not have room for it
        # alongside the preinstalled SDKs.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          # Solve exactly what pixi.lock pins, and fail if it has drifted
          # from pyproject.toml rather than silently re-solving.
          locked: true
          environments: ${{ matrix.environment }}
          cache: true

      - name: Run tests
        run: >
          pixi run -e ${{ matrix.environment }}
          python -m pytest ${{ matrix.path }}
          -m "$PYTEST_SELECTION"
          -q --durations=10
